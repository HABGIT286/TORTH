<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9333ea"/>
      <stop offset="50%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#06030c"/>
    </linearGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="111" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="4"/>

  <!-- Earthlink stylized signal crest & fiber optics -->
  <g transform="translate(256, 256)" filter="url(#glow)">
    <!-- Outer wave arc -->
    <path d="M -140 -20 A 150 150 0 0 1 140 -20" fill="none" stroke="url(#neonCyan)" stroke-width="26" stroke-linecap="round"/>
    <!-- Middle wave arc -->
    <path d="M -90 30 A 100 100 0 0 1 90 30" fill="none" stroke="#a855f7" stroke-width="22" stroke-linecap="round"/>
    <!-- Center pulse core -->
    <circle cx="0" cy="80" r="32" fill="#38bdf8"/>
    <circle cx="0" cy="80" r="44" fill="none" stroke="rgba(56,189,248,0.5)" stroke-width="6"/>
  </g>
</svg>
