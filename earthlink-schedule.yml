
name: Earthlink Scheduled Telegram Report

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: earthlink-telegram-schedule
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check schedule and send report
        env:
          EARTHLINK_USERNAME: ${{ secrets.EARTHLINK_USERNAME }}
          EARTHLINK_PASSWORD: ${{ secrets.EARTHLINK_PASSWORD }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py --scheduled

      - name: Save sent status
        if: success()
        run: |
          if git diff --quiet -- schedule.yml; then
            echo "No schedule state change."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add schedule.yml
          git commit -m "Mark Earthlink report as sent"
          git push
