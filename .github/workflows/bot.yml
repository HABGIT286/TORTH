
name: Earthlink Telegram Bot

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: earthlink-telegram-interactive-bot
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-24.04
    timeout-minutes: 350

    steps:
      - name: Download repository files
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Start interactive Telegram bot
        env:
          EARTHLINK_USERNAME: ${{ secrets.EARTHLINK_USERNAME }}
          EARTHLINK_PASSWORD: ${{ secrets.EARTHLINK_PASSWORD }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_BRANCH: ${{ github.ref_name }}
        run: python -u earthlink_telegram_bot.py
