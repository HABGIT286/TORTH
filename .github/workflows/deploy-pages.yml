name: Deploy Website to GitHub Pages

# هذا الملف يقوم بنشر موقعك كـ موقع حي ومجاني على الإنترنت عبر GitHub Pages
# الرابط: https://habgit286.github.io/TORTH/

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Repository Code
        uses: actions/checkout@v4

      - name: 🌐 Configure GitHub Pages (قبل البناء لضبط المسار)
        id: pages
        uses: actions/configure-pages@v5

      - name: ⚡ Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 🛠️ Install Dependencies
        run: npm install --legacy-peer-deps

      - name: 🏗️ Build Production Website
        run: |
          # بناء المشروع بمسار نسبي متوافق 100% مع جيت هاب
          npm run build
          # نسخ صفحة index إلى 404 لمنع الشاشة البيضاء عند التحديث
          cp dist/index.html dist/404.html

      - name: 📦 Upload Website Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: 🚀 Deploy Website to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
