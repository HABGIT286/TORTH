name: earthlink_vip
description: "بوابة مشتركي إيرثلنك الفاخرة - Earthlink VIP Flutter Application"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Networking & HTTP
  http: ^1.2.0

  # Storage & Preferences
  shared_preferences: ^2.2.2

  # Typography & Fonts
  google_fonts: ^6.1.0

  # Icons & UI Polish
  lucide_icons: ^0.257.0
  intl: ^0.19.0
  flutter_animate: ^4.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
